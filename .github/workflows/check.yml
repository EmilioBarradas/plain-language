name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake check

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin validate .
